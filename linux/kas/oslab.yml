header:
  version: 14

distro: oslab
target:
  - mc:rpi4:oslab-image
  - mc:qemu:oslab-image

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    path: layers/bitbake
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f # yocto-6.0.4
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/openembedded-core
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc # yocto-6.0.4
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804 # yocto-6.0.4
    layers:
      meta-poky:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    path: layers/meta-raspberrypi
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d # wrynose branch, untagged
    layers:
      .:

  meta-oslab:
    path: meta-oslab
    layers:
      .:

local_conf_header:
  cache: |
    DL_DIR = "${TOPDIR}/../cache/downloads"
    SSTATE_DIR = "${TOPDIR}/../cache/sstate"
